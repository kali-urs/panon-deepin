name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  package-deb:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            build-essential \
            fakeroot \
            debhelper-compat \
            curl
          rm -rf /var/lib/apt/lists/*

      - name: debian/rules build (compile step only)
        run: |
          set -o pipefail
          debian/rules build 2>&1 | tee /tmp/build-1.log

      - name: debian/rules binary (package step)
        run: |
          set -o pipefail
          fakeroot debian/rules binary 2>&1 | tee /tmp/build-2.log

      - name: Print build errors as annotations
        if: failure()
        run: |
          if [ -f /tmp/build-1.log ]; then
            tail -50 /tmp/build-1.log | while IFS= read -r line; do
              echo "::error file=build1.log,title=compile-tail::${line:0:500}"
            done
          fi
          if [ -f /tmp/build-2.log ]; then
            tail -50 /tmp/build-2.log | while IFS= read -r line; do
              echo "::error file=build2.log,title=package-tail::${line:0:500}"
            done
          fi

      - name: Push build error log to branch
        if: failure()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin build-error-log 2>/dev/null || true
          git checkout -b build-error-log
          if [ -f /tmp/build-1.log ]; then
            cp /tmp/build-1.log build-1-error.log
          fi
          if [ -f /tmp/build-2.log ]; then
            cp /tmp/build-2.log build-2-error.log
          fi
          git add build-*-error.log
          git commit -m "build error log $(date -u +%Y%m%d-%H%M%S)" 2>/dev/null || true
          git push -f origin build-error-log

      - name: Upload build log 1
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build1-log
          path: /tmp/build-1.log
          compression-level: 0
          overwrite: true

      - name: Upload build log 2
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build2-log
          path: /tmp/build-2.log
          compression-level: 0
          overwrite: true

      - name: List package
        run: |
          mkdir -p deb-pkg
          mv ../*.deb deb-pkg/ 2>/dev/null || true

      - name: Upload deb package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: deb-pkg/*.deb
          compression-level: 0
