name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            libdtk6gui-dev \
            build-essential \
            lintian \
            fakeroot \
            debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Debug DTK6 and environment
        run: |
          echo "=== Installed dtk packages ==="
          dpkg -l | grep -i dtk || true
          echo "=== DGuiApplicationHelper ==="
          find /usr -name "DGuiApplicationHelper" 2>/dev/null || echo "NOT FOUND"
          find /usr -name "*DGuiApplicationHelper*" 2>/dev/null || echo "NOT FOUND"
          echo "=== pkg-config dtk ==="
          pkg-config --list-all 2>/dev/null | grep -i dtk || echo "NONE"
          echo "=== CMake modules ==="
          ls /usr/lib/x86_64-linux-gnu/cmake/ | grep -i dtk || echo "NONE"
          ls /usr/lib/cmake/ | grep -i dtk || echo "NONE"
          echo "=== dpkg -L libdtk6gui-dev ==="
          dpkg -L libdtk6gui-dev 2>/dev/null || echo "Package not installed"
          echo "=== apt-cache search dtk ==="
          apt-cache search dtk6 2>/dev/null || echo "apt-cache failed"
          apt-cache search dtkgui 2>/dev/null || echo "apt-cache failed"

      - name: Build plugin
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          cmake --build . -j$(nproc)

      - name: Check .so
        run: |
          file build/libpanon.so
          ldd build/libpanon.so

      - uses: actions/upload-artifact@v4
        with:
          name: libpanon.so
          path: build/libpanon.so
          compression-level: 0

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            libdtk6gui-dev \
            build-essential \
            fakeroot \
            debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb package
        run: |
          dpkg-buildpackage -b -us -uc --no-sign
          mkdir -p deb-pkg
          mv ../*.deb ../*.buildinfo ../*.changes deb-pkg/ 2>/dev/null || true

      - name: List package
        run: dpkg-deb --info deb-pkg/*.deb 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: deb-pkg/*.deb
          compression-level: 0
