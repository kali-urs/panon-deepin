name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            libdtk6gui-dev \
            build-essential \
            lintian \
            fakeroot \
            debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Debug DTK6 and environment
        run: |
          echo "=== Installed packages with dde ==="
          dpkg -l | grep -i dde || true
          echo "=== Which package provides pluginsiteminterface.h ==="
          dpkg -S /usr/include/dde-dock/pluginsiteminterface.h 2>/dev/null || echo "Not found in dpkg db"
          echo "=== dde-dock header content (first 80 lines) ==="
          head -80 /usr/include/dde-dock/pluginsiteminterface.h 2>/dev/null || echo "File not found"
          echo "=== dde-dock.pc ==="
          cat /usr/lib/x86_64-linux-gnu/pkgconfig/dde-dock.pc 2>/dev/null || echo "pc file not found"
          echo "=== pkg-config dde-dock --cflags ==="
          pkg-config dde-dock --cflags 2>/dev/null || echo "dde-dock.pc not found"
          echo "=== Compile test with -E (preprocess only) ==="
          cat > /tmp/test_e.cpp << 'EOF'
          #include <pluginsiteminterface.h>
          int main() { return 0; }
          EOF
          c++ -std=gnu++17 -E /tmp/test_e.cpp \
            -I/usr/include/dde-dock -I/usr/include/dtk6/DGui \
            -I/usr/include/dtk6/DCore -I/usr/include/dtk6/DLog \
            -isystem /usr/include/x86_64-linux-gnu/qt6/QtCore \
            -isystem /usr/include/x86_64-linux-gnu/qt6 \
            -isystem /usr/lib/x86_64-linux-gnu/qt6/mkspecs/linux-g++ \
            -isystem /usr/include/x86_64-linux-gnu/qt6/QtWidgets \
            -isystem /usr/include/x86_64-linux-gnu/qt6/QtGui \
            -o /tmp/test_e_out.txt 2>&1 && echo "Preprocessing succeeded" || echo "Preprocessing failed"
          echo "=== Full header content ==="
          cat /usr/include/dde-dock/pluginsiteminterface.h
          echo "=== Checking dtk availability ==="
          dpkg -l | grep dtk6 || true
          echo "=== dtk6gui.pc content ==="
          cat /usr/lib/x86_64-linux-gnu/pkgconfig/dtk6gui.pc 2>/dev/null || echo "not found"

      - name: Build plugin
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          cmake --build . -j$(nproc)

      - name: Check .so
        run: |
          file build/libpanon.so
          ldd build/libpanon.so

      - uses: actions/upload-artifact@v4
        with:
          name: libpanon.so
          path: build/libpanon.so
          compression-level: 0

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            libdtk6gui-dev \
            build-essential \
            fakeroot \
            debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb package
        run: |
          dpkg-buildpackage -b -us -uc --no-sign
          mkdir -p deb-pkg
          mv ../*.deb ../*.buildinfo ../*.changes deb-pkg/ 2>/dev/null || true

      - name: List package
        run: dpkg-deb --info deb-pkg/*.deb 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: deb-pkg/*.deb
          compression-level: 0
