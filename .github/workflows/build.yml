name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            libdtk6gui-dev \
            build-essential \
            lintian \
            fakeroot \
            debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Debug DTK6 and environment
        run: |
          echo "=== Installed dtk packages ==="
          dpkg -l | grep -i dtk || true
          echo "=== pkg-config dtk ==="
          pkg-config --list-all 2>/dev/null | grep -i dtk || echo "NONE"
          echo "=== dpkg -L dde-dock-dev ==="
          dpkg -L dde-dock-dev 2>/dev/null || echo "Package not installed"
          echo "=== dpkg -L libdtk6gui-dev ==="
          dpkg -L libdtk6gui-dev 2>/dev/null || echo "Package not installed"
          echo "=== pkg-config dtk6gui --cflags ==="
          pkg-config dtk6gui --cflags 2>/dev/null || echo "dtk6gui.pc not found"
          echo "=== pkg-config dde-dock --cflags ==="
          pkg-config dde-dock --cflags 2>/dev/null || echo "dde-dock.pc not found"
          echo "=== DGuiApplicationHelper ==="
          find /usr -name "DGuiApplicationHelper" -o -name "DGuiApplicationHelper.h" 2>/dev/null
          echo "=== dde-dock header ==="
          find /usr -name "pluginsiteminterface.h" 2>/dev/null
          echo "=== Compile test: does #include work? ==="
          cat > /tmp/test_include.cpp << 'EOF'
          #include <QObject>
          #include <pluginsiteminterface.h>
          PluginFlags testFlags() { return PluginFlag::Type_Common; }
          int main() { return 0; }
          EOF
          c++ -std=gnu++17 -c /tmp/test_include.cpp \
            -I/usr/include/dde-dock -I/usr/include/dtk6/DGui \
            -I/usr/include/dtk6/DCore -I/usr/include/dtk6/DLog \
            -isystem /usr/include/x86_64-linux-gnu/qt6/QtCore \
            -isystem /usr/include/x86_64-linux-gnu/qt6 \
            -isystem /usr/lib/x86_64-linux-gnu/qt6/mkspecs/linux-g++ \
            -isystem /usr/include/x86_64-linux-gnu/qt6/QtWidgets \
            -isystem /usr/include/x86_64-linux-gnu/qt6/QtGui \
            -o /tmp/test_include.o 2>&1 || true
          echo "=== Check dde-dock pc file ==="
          cat /usr/lib/x86_64-linux-gnu/pkgconfig/dde-dock.pc 2>/dev/null || true

      - name: Build plugin
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          cmake --build . -j$(nproc)

      - name: Check .so
        run: |
          file build/libpanon.so
          ldd build/libpanon.so

      - uses: actions/upload-artifact@v4
        with:
          name: libpanon.so
          path: build/libpanon.so
          compression-level: 0

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            libdtk6gui-dev \
            build-essential \
            fakeroot \
            debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb package
        run: |
          dpkg-buildpackage -b -us -uc --no-sign
          mkdir -p deb-pkg
          mv ../*.deb ../*.buildinfo ../*.changes deb-pkg/ 2>/dev/null || true

      - name: List package
        run: dpkg-deb --info deb-pkg/*.deb 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: deb-pkg/*.deb
          compression-level: 0
