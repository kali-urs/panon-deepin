name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  package-deb:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            pkg-config \
            qt6-base-dev \
            libpulse-dev \
            dde-dock-dev \
            build-essential \
            fakeroot \
            debhelper-compat \
            curl
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb package
        run: |
          set -o pipefail
          dpkg-buildpackage -b -us -uc 2>&1 | tee /tmp/build.log

      - name: Report build error as issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(tail -100 /tmp/build.log | python3 -c "import sys,json; print(json.dumps({'title':'Build Failed ' + '${{ github.ref_name }}', 'body':'\`\`\`\n' + sys.stdin.read()[-6000:] + '\n\`\`\`'}))")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "$BODY"

      - name: List package
        run: |
          mkdir -p deb-pkg
          mv ../*.deb deb-pkg/ 2>/dev/null || true

      - name: Upload deb package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: deb-pkg/*.deb
          compression-level: 0
