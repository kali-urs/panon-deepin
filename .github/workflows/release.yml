name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake pkg-config qt6-base-dev libpulse-dev \
            dde-dock-dev \
            build-essential fakeroot debhelper-compat
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb
        run: |
          dpkg-buildpackage -b -us -uc --no-sign
          mkdir -p release-artifacts
          mv ../*.deb release-artifacts/ 2>/dev/null || true

      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panon ${{ github.ref_name }}
          body: |
            ## Panon ${{ github.ref_name }}

            Audio spectrum visualizer dock plugin for Deepin 25.

            ### Install
            ```bash
            sudo apt install ./dde-dock-panon_*.deb
            pkill dde-dock
            ```
          files: release-artifacts/*
