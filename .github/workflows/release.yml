name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake pkg-config qt6-base-dev libpulse-dev \
            dde-dock-dev \
            build-essential fakeroot debhelper-compat curl
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb with logging
        shell: bash
        run: |
          set -o pipefail
          dpkg-buildpackage -b -us -uc 2>&1 | tee /tmp/release-build.log

      - name: Print build error (debug)
        if: failure()
        run: |
          echo "=== Last 60 lines of build log ==="
          tail -60 /tmp/release-build.log
          echo "=== End of build log ==="

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: /tmp/release-build.log
          compression-level: 0

      - name: Prepare release artifacts (on success)
        if: success()
        run: |
          mkdir -p release-artifacts
          mv ../*.deb release-artifacts/ 2>/dev/null || true

      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panon ${{ github.ref_name }}
          body: |
            ## Panon ${{ github.ref_name }}

            Audio spectrum visualizer dock plugin for Deepin 25.

            ### Install
            ```bash
            sudo apt install ./dde-dock-panon_*.deb
            pkill dde-dock
            ```
          files: release-artifacts/*
