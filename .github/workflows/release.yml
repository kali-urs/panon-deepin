name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y \
            cmake pkg-config qt6-base-dev libpulse-dev \
            dde-dock-dev \
            build-essential fakeroot debhelper-compat curl
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb package
        run: |
          set -o pipefail
          dpkg-buildpackage -b -us -uc 2>&1 | tee /tmp/build.log

      - name: Report build error as issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(tail -100 /tmp/build.log | python3 -c "import sys,json; print(json.dumps({'title':'Release Build Failed ${{ github.ref_name }}', 'body':'\`\`\`\n' + sys.stdin.read()[-6000:] + '\n\`\`\`'}))")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "$BODY"

      - name: Prepare release artifacts
        if: success()
        run: |
          mkdir -p release-artifacts
          mv ../*.deb release-artifacts/ 2>/dev/null || true

      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panon ${{ github.ref_name }}
          body: |
            ## Panon ${{ github.ref_name }}

            Audio spectrum visualizer dock plugin for Deepin 25 (DDE 7.0).

            ### Install
            ```bash
            sudo apt install ./dde-dock-panon_*.deb
            killall dde-shell
            ```

            ### Auto-Update (v1.3.0+)
            The plugin checks for updates via context menu. When a new version is found, it offers to download and install automatically via `pkexec`.

            ### Reference Projects
            - [KDE panon](https://github.com/KDE/panon) — original KDE plasma panel audio visualizer
          files: release-artifacts/*
