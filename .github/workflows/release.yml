name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --user root

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y \
            cmake pkg-config qt6-base-dev libpulse-dev \
            dde-dock-dev \
            build-essential fakeroot debhelper-compat curl
          rm -rf /var/lib/apt/lists/*

      - name: Build .deb package
        run: |
          set -o pipefail
          dpkg-buildpackage -b -us -uc 2>&1 | tee /tmp/build.log

      - name: Report build error as issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(tail -100 /tmp/build.log | python3 -c "import sys,json; print(json.dumps({'title':'Release Build Failed ${{ github.ref_name }}', 'body':'\`\`\`\n' + sys.stdin.read()[-6000:] + '\n\`\`\`'}))")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "$BODY"

      - name: Prepare release artifacts
        if: success()
        run: |
          mkdir -p release-artifacts
          mv ../*.deb release-artifacts/ 2>/dev/null || true

      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panon ${{ github.ref_name }}
          body: |
            ## Panon ${{ github.ref_name }}

            Audio spectrum visualizer dock plugin for **Deepin 25 (DDE 7.0)**.

            ### ✨ Features

            - **7 visual effects**: 柱状 (Bars), 波形 (Wave), 实心 (Solid), 光束 (Beam), 山丘 (Hill), 频谱图 (Spectrogram), 弹球 (Bouncing Balls)
            - Dual-channel stereo spectrum with left-right mirror rendering
            - Real-time 幻彩 color cycling mode
            - 27 frequency bars covering 0–24 kHz with adaptive high-frequency boost
            - Auto-update: in-app version check → download with progress bar on spectrum → `pkexec` install
            - Persistent settings (effect, width, color mode, audio source) across reboots
            - Transparent background, integrates natively into the dock panel

            ### 📦 Install

            ```bash
            sudo apt install ./dde-dock-panon_*.deb
            killall dde-shell
            ```

            ### 📜 Changelog (v1.0 → v2.0.0)

            - **v1.0**: Initial release — KDE panon migration to Deepin dock plugin, BarEffect with basic spectrum
            - **v1.0.3–v1.0.5**: Left-right channel mirror, HF boost, QSettings persistence
            - **v1.1.0**: New BallEffect (弹球) with gravity physics
            - **v1.2.0**: Auto-update checker via GitHub API, context menu integration
            - **v1.3.0**: Auto-download + `pkexec dpkg -i` install, enhanced HF gain
            - **v1.3.1**: Restructured gain chain (boost before sqrt compression, no post-normalization)
            - **v1.3.2**: 32→27 bars, suppressed low-frequency gain
            - **v1.3.3–v1.3.4**: Fix restart commands for Deepin 25 (trayplugin-loader → dde-shell)
            - **v1.3.5**: Fix polkit auth dialog — async QProcess::start for pkexec
            - **v1.3.6**: Download progress bar + percentage on spectrum widget overlay
            - **v2.0.0**: Summary stable release

            ### 🔧 Technical

            - C++17 + Qt6 (Core, Widgets) + PulseAudio (`pa_simple`)
            - Old DDE dock plugin API (`com.deepin.dock.PluginsItemInterface`)
            - FFT: 1024-point Cooley-Tukey with Hanning window, 48 kHz sample rate
            - Gain chain: linear boost → sqrt compression → adaptive HF weighting (`0.3 + 12.7×t²`)
            - QProcess + curl for all HTTP operations (no Qt6::Network dependency)

            ### 📚 Reference Projects

            - [KDE panon](https://github.com/KDE/panon) — original KDE plasma panel audio visualizer
          files: release-artifacts/*
